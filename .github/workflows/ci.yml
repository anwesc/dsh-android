name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 插件自身的测试在 dsh-qqbot-guard 仓库跑；这里只需要 npm 来拉 seed 包。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # rootfs.bin is not committed; a placeholder keeps the asset graph valid for
      # compilation and lint, which never read the file.
      - name: Placeholder runtime image
        run: head -c 4096 /dev/urandom > app/src/main/assets/rootfs.bin

      # The APK ships a generated copy of the npm-pinned dsh-qqbot-guard; catch a stale seed
      # here instead of discovering it on a device.
      - name: Plugin seed in sync
        run: bash scripts/sync-plugin-seed.sh --check

      - name: Assemble debug
        run: ./gradlew --no-daemon --console=plain assembleDebug

      # SemVer 决定「市场安装的版本会不会被内置版覆盖」，排序错了就是静默回滚，用 JVM 单测守住。
      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      # NewApi is escalated to an error: it catches JDK methods the Android runtime lacks
      # (InputStream.readAllBytes crashed on device before this gate existed).
      - name: Lint
        run: ./gradlew --no-daemon --console=plain lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
