# qqbot-guard bundle patch
#
# 本包被列入 profile 的 dsh.profile.bundles 后，dsh 启动时自动应用此 patch，
# 把下面这一行插进插件树。真正的门禁参数请在 profile 的 cordis.patch.yml 里覆盖
# （同 id 的普通 patch 会覆盖这里的默认值）。
#
# 注意：profile 的 cordis.patch.yml 只能改「已存在的 id」，新增插件行必须写在
# bundle patch（本文件）里，或者用 `- insert:` 形式手动插入。

- insert:
    - id: qqbot-guard
      name: 'dsh-qqbot-guard'
      config:
        # triggers 故意不写：由 $DSH_HOME/qqbot-guard.json 或 DEFAULT_CONFIG（大肥鱼/肥鱼/鱼鱼）决定，
        # 手机端改关键词不用碰 YAML。要在这里写死也行，会盖过 JSON 文件。
        ignoreCase: true
        # 留空则自动探测；桌面端建议在 profile patch 里写死
        qqbotPackage: ''
        strictVersion: false
        verbose: true
